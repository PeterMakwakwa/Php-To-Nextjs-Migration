name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: next-app

jobs:
  checks:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - run: npm ci
      - run: npm run check

      - name: PHP syntax check
        working-directory: legacy-php
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  integration:
    name: Build, end-to-end and browser tests
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      # The legacy PHP app is the system of record: the build prerenders from it and every test talks to it.
      # `--wait` blocks until the container's health check (GET /api/health) passes.
      - name: Start legacy PHP (Docker)
        working-directory: .
        run: docker compose up --build --detach --wait legacy-php

      - run: npm ci
      - run: npm run build

      - name: Start Next.js (production build)
        run: |
          npm start > "$RUNNER_TEMP/next.log" 2>&1 &
          for i in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://localhost:3000/articles && exit 0
            sleep 1
          done
          echo "Next.js did not start" && cat "$RUNNER_TEMP/next.log" && exit 1

      - run: npm run test:e2e

      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: next-app/test-results/
          retention-days: 7

      - name: Show server logs
        if: failure()
        working-directory: .
        run: |
          cat "$RUNNER_TEMP/next.log" || true
          docker compose logs legacy-php
